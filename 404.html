<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 | Fatih Demirsoy</title><meta name="robots" content="noindex"><style>@font-face{font-family:"Schibsted Grotesk";src:url("/fonts/schibsted-grotesk.woff2") format("woff2");font-weight:400 800;font-style:normal;font-display:swap}

:root{
  --bg:#EDF1EF; --surface:#F8FAF9; --ink:#1B2A31; --muted:#56666D;
  --line:#C9D3CF; --ok:#0E7A63; --diff:#A3245A; --accent:#1E4FBF; --on-accent:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121A1E; --surface:#1A252A; --ink:#E4ECE9; --muted:#9AAAA6;
    --line:#2E3D43; --ok:#3FC7A4; --diff:#F07AAB; --accent:#7EA2FF; --on-accent:#0D1620;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:1.0625rem;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:68rem;margin:0 auto;padding:0 1.25rem}
.measure{max-width:38rem}

*,*::before,*::after{box-sizing:border-box}
/* header */
.top{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0}
.name{font-weight:800;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.top a.small{font-size:.95rem}

/* hero */
.hero{display:grid;gap:2.5rem;padding:2.5rem 0 4rem;align-items:center}
@media (min-width:60rem){.hero{grid-template-columns:1fr 1.05fr;gap:3.5rem;padding:4rem 0 5.5rem}}
h1{
  font-size:clamp(2.1rem,5.2vw,3.4rem);line-height:1.05;letter-spacing:-.025em;
  font-weight:800;margin:0 0 1.25rem;
}
.lede{font-size:1.2rem;color:var(--muted);margin:0 0 2rem;max-width:32rem}
.btn{
  display:inline-block;background:var(--accent);color:var(--on-accent);
  font-weight:700;text-decoration:none;padding:.9rem 1.4rem;border-radius:999px;
}
.btn:hover{filter:brightness(1.08)}
.under{font-size:.95rem;color:var(--muted);margin-top:1rem}

/* the count report: the memorable element */
.report{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:1.25rem 1.25rem .75rem;
}
.report h2{font-size:1rem;margin:0 0 .25rem;font-weight:700;letter-spacing:0}
.report p.cap{font-size:.9rem;color:var(--muted);margin:0 0 1rem}
.scroll{overflow-x:auto}
table.count{width:100%;border-collapse:collapse;font-size:.98rem;min-width:24rem}
.count th{font-size:.85rem;font-weight:500;color:var(--muted);text-align:right;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
.count th:first-child,.count td:first-child{text-align:left}
.count td{padding:.6rem .5rem;text-align:right;border-bottom:1px solid var(--line)}
.count tr:last-child td{border-bottom:0}
.count td.who{font-weight:500}
.st{font-weight:700;white-space:nowrap}
.st.ok{color:var(--ok)}
.st.diff{color:var(--diff)}
.note{font-size:.85rem;color:var(--muted);text-align:left!important;padding-top:0!important;border-bottom:1px solid var(--line)}

/* sections */
section.block{padding:3.5rem 0;border-top:1px solid var(--line)}
h2.sec{font-size:clamp(1.6rem,3.2vw,2.2rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 1rem;font-weight:800}
.block p{margin:0 0 1rem}

ol.steps{list-style:none;padding:0;margin:2rem 0 0;display:grid;gap:1.75rem;counter-reset:s}
@media (min-width:48rem){ol.steps{grid-template-columns:repeat(4,1fr)}}
ol.steps li{counter-increment:s;border-top:3px solid var(--ink);padding-top:.9rem}
ol.steps li::before{content:counter(s);display:block;font-weight:800;font-size:1.6rem;line-height:1;margin-bottom:.6rem}
ol.steps h3{font-size:1.05rem;margin:0 0 .35rem}
ol.steps p{font-size:.97rem;color:var(--muted);margin:0}

.prices{display:grid;gap:2.5rem}
@media (min-width:56rem){.prices{grid-template-columns:1.2fr 1fr;gap:4rem}}
table.price{width:100%;border-collapse:collapse;}
.price td{padding:.85rem 0;border-bottom:1px solid var(--line);vertical-align:top}
.price td:last-child{text-align:right;font-weight:700;white-space:nowrap;padding-left:1rem}
.price tr.main td{font-size:1.15rem}
.price small{display:block;color:var(--muted);font-weight:400;font-size:.9rem}
.fine{font-size:.92rem;color:var(--muted);margin-top:1rem}
.example{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.25rem 1.4rem}
.example h3{margin:0 0 .75rem;font-size:1.05rem}
.example p{margin:0 0 .5rem;}
.example p:last-child{margin:0}

.two{display:grid;gap:2rem}
@media (min-width:48rem){.two{grid-template-columns:1fr 1fr;gap:3.5rem}}
.two h3{font-size:1.1rem;margin:0 0 .75rem}
ul.plain{margin:0;padding-left:1.1rem}
ul.plain li{margin-bottom:.45rem}

.case{display:grid;gap:2rem}
@media (min-width:56rem){.case{grid-template-columns:.8fr 1.2fr;gap:4rem}}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:0}
.facts div{border-left:3px solid var(--ok);padding-left:.75rem}
.facts dt{font-size:.9rem;color:var(--muted)}
.facts dd{margin:0;font-size:1.9rem;font-weight:800;line-height:1.1}

details{border-bottom:1px solid var(--line);padding:1rem 0}
details summary{cursor:pointer;font-weight:700;list-style-position:outside}
details p{margin:.6rem 0 0;color:var(--muted)}

.contact{padding:4rem 0 5rem;border-top:1px solid var(--line)}
.contact .row{display:flex;flex-wrap:wrap;gap:1rem 1.5rem;align-items:center;margin-top:1.5rem}
footer{font-size:.9rem;color:var(--muted);padding:1.5rem 0 2.5rem;border-top:1px solid var(--line)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* form */
form.quote{display:grid;gap:1rem;margin-top:1.75rem;max-width:40rem}
@media (min-width:40rem){form.quote{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
.field label{display:block;font-weight:500;font-size:.95rem;margin-bottom:.35rem}
.field .opt{color:var(--muted);font-weight:400}
.field input,.field select,.field textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;
}
.field textarea{min-height:6.5rem;resize:vertical}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.actions{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:center}
button.btn{border:0;cursor:pointer;font:inherit;font-weight:700}
button.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.status{min-height:1.5rem;font-weight:500;margin:0}
.status.ok{color:var(--ok)}.status.err{color:var(--diff)}
.kvkk{font-size:.88rem;color:var(--muted);margin:0}
.contact .alt{margin-top:2rem;color:var(--muted)}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 0}
.top-right{display:flex;align-items:center;gap:.6rem}
.flag{width:1.35rem;height:.9rem;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.12)}

/* language menu */
.lang-menu{position:relative;border:0;padding:0}
.lang-menu summary{list-style:none;display:flex;align-items:center;gap:.5rem;cursor:pointer;
  padding:.5rem .75rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);
  font-size:.95rem;font-weight:500;min-height:44px;user-select:none}
.lang-menu summary::-webkit-details-marker{display:none}
.lang-menu summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lang-menu .chev{width:.65rem;height:.4rem;color:var(--muted);transition:transform .15s}
.lang-menu[open] .chev{transform:rotate(180deg)}
.lang-code{display:none}
.lang-list{position:absolute;right:0;top:calc(100% + .4rem);z-index:20;margin:0;padding:.35rem;list-style:none;
  min-width:13.5rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(20,35,40,.14)}
.lang-list a{display:flex;align-items:center;gap:.65rem;padding:.6rem .7rem;border-radius:8px;color:var(--ink);text-decoration:none;min-height:44px}
.lang-list a:hover,.lang-list a:focus-visible{background:var(--bg);outline:none}
.lang-list a[aria-current="true"]{font-weight:700}
.lang-list a[aria-current="true"]::after{content:"✓";margin-left:auto;color:var(--ok)}

/* whatsapp button */
.wa-btn{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem .9rem;min-height:44px;border-radius:999px;
  background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:700;font-size:.95rem}
.wa-btn svg{width:1.15rem;height:1.15rem;flex:none}
.wa-btn:hover{filter:brightness(1.08)}

/* layout fixes */
figure.report{margin:0}
.hero>*,.prices>*,.two>*,.case>*{min-width:0}
.count td.note{font-variant-numeric:normal}
.facts dd{overflow-wrap:anywhere}

@media (max-width:40rem){
  .wrap{padding:0 1rem}
  .lang-cur,.wa-txt{display:none}
  .lang-code{display:inline;font-weight:700;letter-spacing:.02em}
  .wa-btn{padding:.5rem;width:44px;justify-content:center}
  .lang-menu summary{padding:.5rem .65rem}
  .hero{padding:1.5rem 0 3rem;gap:2rem}
  h1{font-size:clamp(1.9rem,8.5vw,2.4rem)}
  .lede{font-size:1.08rem}
  .btn{display:block;text-align:center;width:100%}
  .report{padding:1rem .85rem .5rem}
  table.count{min-width:0;font-size:.88rem}
  .count th,.count td{padding-left:.3rem;padding-right:.3rem}
  .count th{font-size:.78rem}
  .st{white-space:normal}
  section.block{padding:2.5rem 0}
  .facts dd{font-size:1.5rem}
  .actions .btn{width:100%}
  .price tr.main td{font-size:1.05rem}
  .contact{padding:3rem 0 3.5rem}
}
.e{padding:5rem 0}</style></head>
<body><div class="wrap"><main class="e"><h1>404</h1><p class="lede">Sayfa bulunamadı. Page not found.</p>
<a class="btn" href="/">Ana sayfa / Home</a></main></div></body></html>
